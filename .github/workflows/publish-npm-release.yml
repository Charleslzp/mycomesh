name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    name: Publish with npm provenance
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --prefix packages/mycomesh-cli --ignore-scripts --no-audit --no-fund

      - name: Publish each package unless its version already exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publish everything first; the registry may take many minutes to list a new version.
          published=()
          for package in packages/mycomesh-cli packages/mycomesh-provider packages/mycomesh-relay; do
            name=$(node -p "require('./$package/package.json').name")
            version=$(node -p "require('./$package/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            (cd "$package" && npm publish --provenance --access public)
            published+=("$name@$version")
          done
          for spec in "${published[@]}"; do
            for attempt in $(seq 1 90); do
              npm view "$spec" dist.integrity && continue 2
              sleep 10
            done
            echo "$spec did not appear on the registry within 15 minutes" >&2
            exit 1
          done
