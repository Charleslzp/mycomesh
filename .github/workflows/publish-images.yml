name: Build container image candidates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-candidates-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Require main source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject non-main candidate builds
        env:
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_SOURCE_REF" != "refs/heads/main" ]]; then
            echo "image candidates may only be built from refs/heads/main" >&2
            exit 1
          fi

  verify:
    name: Verify release
    needs: validate-source
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish-candidate:
    name: Build ${{ matrix.component }} candidate
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: node
            dockerfile: ./Dockerfile
            image: mycomesh-node
          - component: provider-codex
            dockerfile: ./Dockerfile
            image: mycomesh-provider-codex

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/charleslzp/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Attest immutable image digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/charleslzp/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
