name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

  consumer-cli:
    name: Consumer CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run CLI tests
        run: npm --prefix packages/mycomesh-cli test

      - name: Verify package contents
        working-directory: packages/mycomesh-cli
        run: npm pack --dry-run

      - name: Verify GitHub install entry point
        run: |
          npm pack --dry-run
          npm install --global --prefix "$RUNNER_TEMP/mycomesh-cli" --ignore-scripts .
          "$RUNNER_TEMP/mycomesh-cli/bin/mycomesh" --version

      - name: Verify Provider bootstrap syntax
        run: bash -n scripts/bootstrap-provider.sh scripts/install-provider.sh scripts/provider-proxy-env.sh scripts/run-consumer-codex.sh packages/mycomesh-cli/scripts/start-consumer.sh

  web:
    name: Browser Consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Run browser protocol tests
        working-directory: web
        run: npm test

      - name: Typecheck and build
        working-directory: web
        run: npm run build
