name: Test

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v11:
    name: Contracts, anvil end to end, Consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: packages/mycomesh-cli/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix packages/mycomesh-cli --ignore-scripts --no-audit --no-fund

      - name: Contract tests
        run: forge build && forge test --summary

      - name: Anvil end-to-end tests (Relay, Provider, keeper, juries, probes, Node Consumer)
        run: python -m unittest discover -s tests -p 'test_mycomesh_*.py' -v

      - name: Consumer and Provider launcher unit tests
        run: |
          npm --prefix packages/mycomesh-cli test
          npm --prefix packages/mycomesh-provider test
          npm --prefix packages/mycomesh-relay test

      - name: Package contents
        run: |
          (cd packages/mycomesh-cli && npm pack --dry-run)
          (cd packages/mycomesh-provider && npm pack --dry-run)
          (cd packages/mycomesh-relay && npm pack --dry-run)
