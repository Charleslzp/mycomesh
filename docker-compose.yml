name: mycomesh

x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-gateway-env: &gateway-env
  GATEWAY_BACKEND: ${GATEWAY_BACKEND:-openai_http}
