  MYCOMESH_BRIDGE_EXTRA_ARGS: ${MYCOMESH_BRIDGE_EXTRA_ARGS---skip-direct-address-verification --allow-any-reputation-signer}
  MYCOMESH_PROVIDER_EXTRA_ARGS: ${MYCOMESH_PROVIDER_EXTRA_ARGS-}
  MYCOMESH_RELAY_EXTRA_ARGS: ${MYCOMESH_RELAY_EXTRA_ARGS---allow-any-signed-consumer}
  MYCOMESH_RELAY_ADVERTISE_HOST: ${MYCOMESH_RELAY_ADVERTISE_HOST:-127.0.0.1}
  MYCOMESH_RELAY_PUBLIC_URL: ${MYCOMESH_RELAY_PUBLIC_URL:-http://127.0.0.1:9900}
  MYCOMESH_RELAY_CONSUMER_PUBLIC_KEYS: ${MYCOMESH_RELAY_CONSUMER_PUBLIC_KEYS:-}
  MYCOMESH_RELAY_ALLOW_ANY_SIGNED_CONSUMER: ${MYCOMESH_RELAY_ALLOW_ANY_SIGNED_CONSUMER:-false}
  MYCOMESH_RELAY_CORS_ALLOWED_ORIGINS: ${MYCOMESH_RELAY_CORS_ALLOWED_ORIGINS:-}
  MYCOMESH_RELAY_V3_ADMISSION_DEPLOYMENT: ${MYCOMESH_RELAY_V3_ADMISSION_DEPLOYMENT:-/app/deployments/sepolia-myco-v3.json}
  MYCOMESH_RELAY_V3_ADMISSION_RPC_URL: ${MYCOMESH_RELAY_V3_ADMISSION_RPC_URL:-}
  MYCOMESH_RELAY_V3_ADMISSION_CONFIRMATIONS: ${MYCOMESH_RELAY_V3_ADMISSION_CONFIRMATIONS:-6}
  MYCOMESH_RELAY_V3_ADMISSION_RPC_TIMEOUT: ${MYCOMESH_RELAY_V3_ADMISSION_RPC_TIMEOUT:-20}
  MYCOMESH_RELAY_CONTROL_BIND_ADDRESS: ${MYCOMESH_RELAY_CONTROL_BIND_ADDRESS:-127.0.0.1}
  MYCOMESH_RELAY_PROVIDER_BIND_ADDRESS: ${MYCOMESH_RELAY_PROVIDER_BIND_ADDRESS:-127.0.0.1}
  MYCOMESH_ADMIN_TOKEN: ${MYCOMESH_ADMIN_TOKEN:-change-me-admin-token}
  MYCOMESH_BILLING_MODE: ${MYCOMESH_BILLING_MODE:-local}
  MYCOMESH_BILLING_DB: ${MYCOMESH_BILLING_DB:-postgresql://mycomesh:change-me-database-password@postgres:5432/mycomesh}
  MYCOMESH_ALLOW_LOCAL_BALANCE_CACHE: ${MYCOMESH_ALLOW_LOCAL_BALANCE_CACHE:-false}
  MYCOMESH_CHAIN_SYNC_MAX_AGE_SECONDS: ${MYCOMESH_CHAIN_SYNC_MAX_AGE_SECONDS:-120}
  MYCOMESH_CHAIN_SYNC_MAX_BLOCK_LAG: ${MYCOMESH_CHAIN_SYNC_MAX_BLOCK_LAG:-12}
  MYCOMESH_INDEXER_STATE: ${MYCOMESH_INDEXER_STATE:-/data/mycomesh-indexer.json}
  MYCOMESH_INDEXER_SYNC_INTERVAL_SECONDS: ${MYCOMESH_INDEXER_SYNC_INTERVAL_SECONDS:-30}
  MYCOMESH_INDEXER_RETRY_SECONDS: ${MYCOMESH_INDEXER_RETRY_SECONDS:-10}
  MYCOMESH_INDEXER_LOOKBACK_BLOCKS: ${MYCOMESH_INDEXER_LOOKBACK_BLOCKS:-100}
  MYCOMESH_INDEXER_CHUNK_BLOCKS: ${MYCOMESH_INDEXER_CHUNK_BLOCKS:-100}
  MYCOMESH_INDEXER_RPC_TIMEOUT_SECONDS: ${MYCOMESH_INDEXER_RPC_TIMEOUT_SECONDS:-20}
  MYCOMESH_REPLAY_DB: ${MYCOMESH_REPLAY_DB:-postgresql://mycomesh:change-me-database-password@postgres:5432/mycomesh}
  MYCOMESH_PUBLIC_KEY_REGISTRATION: ${MYCOMESH_PUBLIC_KEY_REGISTRATION:-false}
  MYCOMESH_KEY_CHALLENGE_CAPACITY: ${MYCOMESH_KEY_CHALLENGE_CAPACITY:-1024}
  MYCOMESH_KEY_CHALLENGE_RATE_PER_MINUTE: ${MYCOMESH_KEY_CHALLENGE_RATE_PER_MINUTE:-120}
  MYCOMESH_KEY_REGISTRATION_RPC_CONCURRENCY: ${MYCOMESH_KEY_REGISTRATION_RPC_CONCURRENCY:-4}
  MYCOMESH_KEY_REGISTRATION_RPC_TIMEOUT: ${MYCOMESH_KEY_REGISTRATION_RPC_TIMEOUT:-20}
  MYCOMESH_KEY_REGISTRATION_MAX_ATTEMPTS: ${MYCOMESH_KEY_REGISTRATION_MAX_ATTEMPTS:-5}
  MYCOMESH_ALLOW_PUBLIC_GATEWAY_REGISTRATION: ${MYCOMESH_ALLOW_PUBLIC_GATEWAY_REGISTRATION:-false}
  MYCOMESH_PUBLIC_GATEWAY_URL: ${MYCOMESH_PUBLIC_GATEWAY_URL:-http://127.0.0.1:8100/v1}
  MYCOMESH_DISCOVERY_LIMIT: ${MYCOMESH_DISCOVERY_LIMIT:-5}
  MYCOMESH_POOL_URL: ${MYCOMESH_POOL_URL:-http://bridge:9800}
  MYCOMESH_MAX_REQUEST_BYTES: ${MYCOMESH_MAX_REQUEST_BYTES:-1048576}
  MYCOMESH_MAX_CONCURRENT_REQUESTS: ${MYCOMESH_MAX_CONCURRENT_REQUESTS:-128}
  MYCOMESH_REQUEST_BODY_TIMEOUT_SECONDS: ${MYCOMESH_REQUEST_BODY_TIMEOUT_SECONDS:-30}
  MYCOMESH_INFERENCE_CONCURRENCY: ${MYCOMESH_INFERENCE_CONCURRENCY:-8}
  MYCOMESH_TIMEOUT_SECONDS: ${MYCOMESH_TIMEOUT_SECONDS:-120}
  MYCOMESH_UVICORN_LIMIT_CONCURRENCY: ${MYCOMESH_UVICORN_LIMIT_CONCURRENCY:-128}
  MYCOMESH_UVICORN_KEEP_ALIVE_SECONDS: ${MYCOMESH_UVICORN_KEEP_ALIVE_SECONDS:-5}
  MYCOMESH_UVICORN_H11_MAX_INCOMPLETE_EVENT_BYTES: ${MYCOMESH_UVICORN_H11_MAX_INCOMPLETE_EVENT_BYTES:-65536}
  MYCOMESH_SETTLEMENT_VERSION: ${MYCOMESH_SETTLEMENT_VERSION:-2}
  MYCOMESH_PRICING_VERSION: ${MYCOMESH_PRICING_VERSION:-}
  MYCOMESH_SETTLEMENT_RPC_URL: ${MYCOMESH_SETTLEMENT_RPC_URL:-}
  MYCOMESH_SETTLEMENT_CONTRACT: ${MYCOMESH_SETTLEMENT_CONTRACT:-}
  MYCOMESH_SETTLEMENT_CHAIN_ID: ${MYCOMESH_SETTLEMENT_CHAIN_ID:-}
  MYCOMESH_SETTLEMENT_CONFIRMATIONS: ${MYCOMESH_SETTLEMENT_CONFIRMATIONS:-6}
  MYCOMESH_SETTLEMENT_RPC_TIMEOUT: ${MYCOMESH_SETTLEMENT_RPC_TIMEOUT:-20}
  MYCOMESH_CHAIN_SYNC_MIN_CONFIRMATIONS: ${MYCOMESH_CHAIN_SYNC_MIN_CONFIRMATIONS:-6}
  ETH_CHAIN_ID: ${ETH_CHAIN_ID:-11155111}
  ETH_RPC_URL: ${ETH_RPC_URL:-}
  MYCO_DEPLOYMENT: ${MYCO_DEPLOYMENT:-}
  MYCO_SETTLEMENT: ${MYCO_SETTLEMENT:-}
  MYCO_TOKEN: ${MYCO_TOKEN:-}
  MYCO_TEST_USDC: ${MYCO_TEST_USDC:-}
  MYCO_TREASURY: ${MYCO_TREASURY:-}
  MYCO_CHANNEL_HASH: ${MYCO_CHANNEL_HASH:-}

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    profiles: ["proxy"]
    networks:
      - proxy-net
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.0"
    logging: *production-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${MYCOMESH_POSTGRES_DB:-mycomesh}
      POSTGRES_USER: ${MYCOMESH_POSTGRES_USER:-mycomesh}
      POSTGRES_PASSWORD: ${MYCOMESH_POSTGRES_PASSWORD:-change-me-database-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - mycomesh-postgres-data:/var/lib/postgresql/data

  gateway:
    build: .
    image: ${MYCOMESH_NODE_IMAGE:-mycomesh/gateway:local}
    profiles: ["gateway"]
    networks:
      - gateway-net
    user: "0:0"
    environment:
      <<: *gateway-env
      HOST: 0.0.0.0
      PORT: 8000
      AGENTS_FILE: /data/agents.json
      SESSION_DB: /data/sessions.sqlite3
      CODEX_HOME: /data/codex-home
      CODEX_WORKDIR: /workspace
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    volumes:
      - mycomesh-gateway-data:/data
      - ${MYCOMESH_WORKSPACE:-.}:/workspace
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]

  proxy-volume-init:
    build: .
    image: ${MYCOMESH_NODE_IMAGE:-mycomesh/gateway:local}
    profiles: ["proxy"]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    environment:
      MYCOMESH_PROVIDER_NETWORK_CONFIG: ${MYCOMESH_PROVIDER_NETWORK_CONFIG:-/app/deployments/sepolia-provider-network-v6.json}
    volumes:
      - mycomesh-proxy-data:/volumes/proxy
      - mycomesh-indexer-data:/volumes/indexer
    entrypoint:
      - /bin/sh
      - -ec
      - |
        identity=/volumes/proxy/request-identity.json
        manifest="$${MYCOMESH_PROVIDER_NETWORK_CONFIG:-/app/deployments/sepolia-provider-network-v6.json}"
        [ -s "$$identity" ] || {
          echo "proxy volume init: request identity is required; migrate the pinned identity before starting Proxy" >&2
          exit 64
        }
        python -m gateway.proxy_identity validate --identity "$$identity" --manifest "$$manifest" >/dev/null
        chown -R 10001:10001 /volumes/proxy /volumes/indexer

  public-node-volume-init:
    build: .
    image: ${MYCOMESH_NODE_IMAGE:-mycomesh/gateway:local}
    profiles: ["bridge", "relay", "public-node"]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - mycomesh-bridge-data:/volumes/bridge
      - mycomesh-relay-data:/volumes/relay
      - mycomesh-v8-indexer-data:/volumes/v8-indexer
      # Copy the host-side onboarding file into the protected Relay volume.
      - ${MYCOMESH_RELAY_OPERATOR_CONFIG:-/dev/null}:/run/mycomesh-relay-operator.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -s /run/mycomesh-relay-operator.json ]; then
          install -m 0600 -o 10001 -g 10001 /run/mycomesh-relay-operator.json /volumes/relay/operator-config.json.tmp
          mv -f /volumes/relay/operator-config.json.tmp /volumes/relay/operator-config.json
        fi
        chown -R 10001:10001 /volumes/bridge /volumes/relay /volumes/v8-indexer

  provider-volume-init:
    build: .
    image: ${MYCOMESH_PROVIDER_IMAGE:-mycomesh/gateway:local}
    profiles: ["provider"]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      MYCOMESH_PROVIDER_AGENT: ${MYCOMESH_PROVIDER_AGENT:-coder}
    volumes:
      - mycomesh-provider-data:/volumes/provider
      - mycomesh-provider-codex-data:/volumes/codex
      - mycomesh-provider-agent-data:/volumes/agent
      - mycomesh-provider-workspace:/volumes/workspace
      # Copy the host-side onboarding file into the protected Provider volume.
      # /dev/null keeps ordinary provider-up runs optional.
      - ${MYCOMESH_PROVIDER_OPERATOR_CONFIG:-/dev/null}:/run/mycomesh-provider-operator.json:ro
      # A Provider wallet generated/imported by the loopback wizard is staged
      # separately from public operator settings and imported atomically.
      - ${MYCOMESH_PROVIDER_IDENTITY_SOURCE:-/dev/null}:/run/mycomesh-provider-identity.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        umask 077
        python -c 'import os; from pathlib import Path; from gateway.client import ensure_agent_key; ensure_agent_key(Path("/volumes/agent/agents.json"), os.environ["MYCOMESH_PROVIDER_AGENT"])'
        if [ -s /run/mycomesh-provider-operator.json ]; then
          install -m 0600 -o 10001 -g 10001 /run/mycomesh-provider-operator.json /volumes/provider/operator-config.json.tmp
          mv -f /volumes/provider/operator-config.json.tmp /volumes/provider/operator-config.json
        fi
        if [ -s /volumes/provider/operator-config.json ] && ! python -m gateway.operator_setup env \
            --role provider --config /volumes/provider/operator-config.json >/dev/null 2>&1; then
          echo "provider-volume-init: ignoring invalid or legacy Provider settings; defaults/wizard will be used" >&2
          mv -f /volumes/provider/operator-config.json \
            "/volumes/provider/operator-config.invalid.$$.json"
        fi
        if [ -s /run/mycomesh-provider-identity.json ]; then
          python -m gateway.provider_identity import \
            --source /run/mycomesh-provider-identity.json \
            --target /volumes/provider/provider-evm-identity.json >/dev/null
        fi
        chown -R 10001:10001 /volumes/provider /volumes/codex /volumes/agent /volumes/workspace
        chmod 0700 /volumes/provider /volumes/codex /volumes/agent /volumes/workspace

  consumer-volume-init:
    build: .
    image: ${MYCOMESH_NODE_IMAGE:-mycomesh/gateway:local}
    profiles: ["consumer"]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - mycomesh-consumer-data:/volumes/consumer
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown -R 10001:10001 /volumes/consumer

  consumer:
    build: .
    image: ${MYCOMESH_NODE_IMAGE:-mycomesh/gateway:local}
    profiles: ["consumer"]
    networks:
      - consumer-net
    user: "10001:10001"
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 256m
    cpus: "1.0"
    logging: *production-logging
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    working_dir: /data
    environment:
      MYCOMESH_CONSUMER_DATA_DIR: /data
      MYCOMESH_CONSUMER_PROTOCOL_VERSION: ${MYCOMESH_CONSUMER_PROTOCOL_VERSION:-8}
      MYCOMESH_CONSUMER_NETWORK_CONFIG: ${MYCOMESH_CONSUMER_NETWORK_CONFIG:-/app/deployments/sepolia-provider-network-v8.json}
      MYCOMESH_CONSUMER_PUBLIC_BASE_URL: http://127.0.0.1:8110/v1
      MYCOMESH_V7_RELAY_URLS: ${MYCOMESH_V7_RELAY_URLS:-https://bridge.mycomesh.xyz}
      MYCOMESH_V7_MAX_FEE_UNITS: ${MYCOMESH_V7_MAX_FEE_UNITS:-100000}
      MYCOMESH_V8_RELAY_URLS: ${MYCOMESH_V8_RELAY_URLS:-https://bridge.mycomesh.xyz}
      MYCOMESH_V8_MAX_FEE_UNITS: ${MYCOMESH_V8_MAX_FEE_UNITS:-100000}
      MYCOMESH_CONSUMER_WEB_DIR: /app/web
      # Comma-separated signed Bridge/Relay discovery origins. Leave empty to
      # use the manifest list; add independent origins when one public domain
      # is unavailable. The Consumer never requires a Gateway URL.
      MYCOMESH_CONSUMER_DISCOVERY_URLS: ${MYCOMESH_CONSUMER_DISCOVERY_URLS:-}
      MYCOMESH_CONSUMER_SESSION_LIFETIME_SECONDS: ${MYCOMESH_CONSUMER_SESSION_LIFETIME_SECONDS:-86400}
      MYCOMESH_CONSUMER_SESSION_MAX_AMOUNT_UNITS: ${MYCOMESH_CONSUMER_SESSION_MAX_AMOUNT_UNITS:-10000000}
      MYCOMESH_CONSUMER_REQUEST_TIMEOUT_SECONDS: ${MYCOMESH_CONSUMER_REQUEST_TIMEOUT_SECONDS:-300}
      MYCOMESH_PRICING_CONFIG: ${MYCOMESH_PRICING_CONFIG:-}
      MYCOMESH_CONSUMER_MAX_REQUEST_BYTES: ${MYCOMESH_CONSUMER_MAX_REQUEST_BYTES:-1048576}
      MYCOMESH_CONSUMER_REQUEST_BODY_TIMEOUT_SECONDS: ${MYCOMESH_CONSUMER_REQUEST_BODY_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8110:8110"
    volumes:
      - mycomesh-consumer-data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      consumer-volume-init:
        condition: service_completed_successfully
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; value=json.load(urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=3)); assert value.get('ok') is True; assert value.get('gateway_dependency') is False; assert value.get('browser_app_ready') is True"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        if [ "$${MYCOMESH_CONSUMER_PROTOCOL_VERSION:-8}" = "8" ]; then
          exec python -m gateway.consumer_v8 serve --host 0.0.0.0 --port 8110;
