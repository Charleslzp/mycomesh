      MYCOMESH_RELAY_SETTLEMENT_PRIVATE_KEY: ${MYCOMESH_RELAY_SETTLEMENT_PRIVATE_KEY:-}
      MYCOMESH_RELAY_SETTLEMENT_CHAIN_ID: ${MYCOMESH_RELAY_SETTLEMENT_CHAIN_ID:-}
      MYCOMESH_RELAY_SETTLEMENT_CONTRACT: ${MYCOMESH_RELAY_SETTLEMENT_CONTRACT:-}
