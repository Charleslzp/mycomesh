  UPSTREAM_METERING_PUBLIC_KEY: ${UPSTREAM_METERING_PUBLIC_KEY:-}
  UPSTREAM_CAPABILITIES_SHA256: ${UPSTREAM_CAPABILITIES_SHA256:-}
  UPSTREAM_METERING_AUDIENCE: ${UPSTREAM_METERING_AUDIENCE:-}
  UPSTREAM_DEFAULT_MAX_OUTPUT_TOKENS: ${UPSTREAM_DEFAULT_MAX_OUTPUT_TOKENS:-2000}
  CENTER_MODEL: ${CENTER_MODEL:-}
  PUBLIC_MODEL_ID: ${PUBLIC_MODEL_ID:-gpt-5.5}
  CODEX_INTERNAL_MODEL: ${CODEX_INTERNAL_MODEL:-gpt-5.5}
  CODEX_COMMAND: codex
  CODEX_SANDBOX: ${CODEX_SANDBOX:-workspace-write}
  CODEX_PROVIDER_BASE_URL: ${CODEX_PROVIDER_BASE_URL:-}
  CODEX_MODEL_PROVIDER: ${CODEX_MODEL_PROVIDER:-mycomesh}
  CODEX_PROVIDER_NAME: ${CODEX_PROVIDER_NAME:-MycoMesh Codex Provider}
  CODEX_PROVIDER_WIRE_API: ${CODEX_PROVIDER_WIRE_API:-responses}
  MYCOMESH_CODEX_TESTNET_METERING: ${MYCOMESH_CODEX_TESTNET_METERING:-false}
  MYCOMESH_CODEX_TESTNET_WEB_SEARCH: ${MYCOMESH_CODEX_TESTNET_WEB_SEARCH:-false}
  CODEX_TESTNET_MAX_OUTPUT_TOKENS: ${CODEX_TESTNET_MAX_OUTPUT_TOKENS:-2000}
  OPENAI_API_KEY: ""
  OPENAI_API_TOKEN: ""
  OPENAI_ACCESS_TOKEN: ""
  CODEX_API_KEY: ""
  CODEX_ACCESS_TOKEN: ""
  CHATGPT_ACCESS_TOKEN: ""
  GATEWAY_MAX_REQUEST_BYTES: ${GATEWAY_MAX_REQUEST_BYTES:-16777216}
  GATEWAY_MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-128}
