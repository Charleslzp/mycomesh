      MYCOMESH_NETWORK_ID: ${MYCOMESH_NETWORK_ID:-mycomesh-local}
    volumes:
      - mycomesh-provider-codex-data:/data
      - mycomesh-provider-agent-data:/agent:ro
      - mycomesh-provider-workspace:/workspace:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      provider-volume-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { [ "$${GATEWAY_BACKEND:-}" != "codex_app_server" ] ||
          { python -m gateway codex-provider configure --codex-home "$${CODEX_HOME:?CODEX_HOME is required}" >/dev/null &&
          python -m gateway codex-provider status --codex-home "$$CODEX_HOME" >/dev/null; }; } &&
          { if [ "$${MYCOMESH_NETWORK_PROFILE:-local}" = "local" ]; then
          python -m gateway health --url http://127.0.0.1:8000/health --timeout 3 >/dev/null;
          else
          python -m gateway health --url http://127.0.0.1:8000/ready --timeout 3 --require-settlement-ready >/dev/null;
          fi; }
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        umask 077
        profile="$${MYCOMESH_NETWORK_PROFILE:-local}"
        if [ "$$profile" != "local" ]; then
          [ "$$profile" = "testnet" ] || {
            echo "provider sidecar preflight: unsupported network profile: $$profile" >&2
            exit 64
          }
          [ "$${GATEWAY_BACKEND:-}" = "codex_app_server" ] || {
            echo "provider sidecar preflight: testnet requires GATEWAY_BACKEND=codex_app_server" >&2
            exit 64
          }
          [ -z "$${UPSTREAM_API_KEY:-}" ] || {
            echo "provider sidecar preflight: Codex subscription mode forbids UPSTREAM_API_KEY" >&2
            exit 64
          }
          [ -z "$${CODEX_PROVIDER_BASE_URL:-}" ] || {
            echo "provider sidecar preflight: testnet forbids a custom CODEX_PROVIDER_BASE_URL" >&2
            exit 64
          }
          [ "$${CODEX_MAX_CONCURRENT_PROCESSES:-}" = "1" ] || exit 64
          [ "$${CODEX_SANDBOX:-}" = "read-only" ] || exit 64
          [ "$${MYCOMESH_CODEX_TESTNET_METERING:-}" = "true" ] || exit 64
        fi
        if [ "$${GATEWAY_BACKEND:-}" = "codex_app_server" ] || [ "$${GATEWAY_BACKEND:-}" = "codex_cli" ]; then
          python -m gateway codex-provider configure --codex-home "$${CODEX_HOME:?CODEX_HOME is required}"
          python -m gateway codex-provider status --codex-home "$$CODEX_HOME" || {
            echo "provider sidecar preflight: run 'make provider-login' first" >&2
            exit 64
          }
        fi
        exec python -m gateway serve --host 0.0.0.0 --port 8000

