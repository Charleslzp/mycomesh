# A MycoMesh V11 Provider serving gpt-5.5 from a ChatGPT-login Codex CLI.
#
#   python -m mycomesh key new provider/signer.key        # the Provider signer
#   docker compose run --rm provider-login                 # one-time ChatGPT device login
#   python -m mycomesh provider register --network ... --owner-key OWNER --signer-key provider/signer.key --operator-id you/1
#   docker compose up -d provider
services:
  provider:
    image: ${MYCOMESH_IMAGE:-ghcr.io/charleslzp/mycomesh:latest}
    restart: unless-stopped
    command:
      - provider
      - serve
      - --network=/app/networks/mycomesh-v11-sepolia.json
      - --signer-key=/keys/signer.key
      - --identity=/keys/identity.json
      - --data-dir=/data
      - --backend=codex
      - --codex-home=/codex
      - --model=gpt-5.5
    volumes:
      - ./provider:/keys
      - ./packages/mycomesh-cli/networks:/app/networks:ro
      - provider-data:/data
      - codex-home:/codex

  provider-login:
    image: ${MYCOMESH_IMAGE:-ghcr.io/charleslzp/mycomesh:latest}
    profiles: ["login"]
    entrypoint: ["codex", "login", "--device-auth"]
    environment:
      CODEX_HOME: /codex
    volumes:
      - codex-home:/codex

volumes:
  provider-data:
  codex-home:
