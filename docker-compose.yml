        - "import json, os, urllib.request; value=json.load(urllib.request.urlopen('http://127.0.0.1:9900/health', timeout=3)); assert value.get('ok') is True; assert isinstance(value.get('providers'), int); expected=os.environ.get('MYCOMESH_RELAY_PAYMENT_ADDRESS', '').lower(); assert not expected or value.get('relay_payment_address') == expected; assert isinstance(value.get('relay_attestation_address'), str) and value['relay_attestation_address'].startswith('0x')"
      interval: 30s
