services:
  consumer-volume-init:
    image: ${MYCOMESH_NODE_IMAGE:?MYCOMESH_NODE_IMAGE is required}
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - mycomesh-consumer-data:/volumes/consumer
    entrypoint: ["/bin/sh", "-ec", "chown -R 10001:10001 /volumes/consumer"]

  consumer:
    image: ${MYCOMESH_NODE_IMAGE:?MYCOMESH_NODE_IMAGE is required}
    user: "10001:10001"
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 256m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    working_dir: /data
    environment:
      MYCOMESH_CONSUMER_DATA_DIR: /data
      MYCOMESH_CONSUMER_PROTOCOL_VERSION: ${MYCOMESH_CONSUMER_PROTOCOL_VERSION:-8}
      MYCOMESH_CONSUMER_NETWORK_CONFIG: ${MYCOMESH_CONSUMER_NETWORK_CONFIG:-/app/deployments/sepolia-provider-network-v8.json}
      MYCOMESH_CONSUMER_PUBLIC_BASE_URL: http://127.0.0.1:8110/v1
      MYCOMESH_V7_RELAY_URLS: ${MYCOMESH_V7_RELAY_URLS:-https://bridge.mycomesh.xyz}
      MYCOMESH_V7_MAX_FEE_UNITS: ${MYCOMESH_V7_MAX_FEE_UNITS:-100000}
      MYCOMESH_V7_REQUEST_TIMEOUT_SECONDS: ${MYCOMESH_V7_REQUEST_TIMEOUT_SECONDS:-300}
      MYCOMESH_V8_RELAY_URLS: ${MYCOMESH_V8_RELAY_URLS:-https://bridge.mycomesh.xyz}
      MYCOMESH_V8_MAX_FEE_UNITS: ${MYCOMESH_V8_MAX_FEE_UNITS:-100000}
      HTTP_PROXY: ${MYCOMESH_CONSUMER_HTTP_PROXY:-}
      HTTPS_PROXY: ${MYCOMESH_CONSUMER_HTTPS_PROXY:-}
      ALL_PROXY: ${MYCOMESH_CONSUMER_ALL_PROXY:-}
      NO_PROXY: ${MYCOMESH_CONSUMER_NO_PROXY:-127.0.0.1,localhost,::1}
      http_proxy: ${MYCOMESH_CONSUMER_HTTP_PROXY:-}
      https_proxy: ${MYCOMESH_CONSUMER_HTTPS_PROXY:-}
      all_proxy: ${MYCOMESH_CONSUMER_ALL_PROXY:-}
      no_proxy: ${MYCOMESH_CONSUMER_NO_PROXY:-127.0.0.1,localhost,::1}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8110:8110"
    volumes:
      - mycomesh-consumer-data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      consumer-volume-init:
        condition: service_completed_successfully
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; value=json.load(urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=3)); assert value.get('ok') is True; assert value.get('gateway_dependency') is False; assert value.get('browser_app_ready') is True"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        if [ "$${MYCOMESH_CONSUMER_PROTOCOL_VERSION:-8}" = "8" ]; then
          exec python -m gateway.consumer_v8 serve --host 0.0.0.0 --port 8110;
        elif [ "$${MYCOMESH_CONSUMER_PROTOCOL_VERSION:-8}" = "7" ]; then
          exec python -m gateway.consumer_v7 serve --host 0.0.0.0 --port 8110;
        else
          exec python -m gateway.local_consumer serve --host 0.0.0.0 --port 8110;
        fi

volumes:
  mycomesh-consumer-data:
